name: CI

# Typecheck only. No API keys, no secrets, and it never runs `blindspot`
# itself — the tool costs credits per run, so CI must never invoke it
# (ROADMAP.md Phase 4). Add lint + a mocked smoke test later.
on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
